<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE4FF"/>
      <stop offset="0.5" stop-color="#D4BFFF"/>
      <stop offset="1" stop-color="#B79CFF"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E7FF"/>
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC1E8"/>
      <stop offset="1" stop-color="#FF8AC9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="100" cy="110" r="5"/>
    <circle cx="420" cy="150" r="4"/>
    <circle cx="80"  cy="380" r="3.5"/>
    <circle cx="430" cy="410" r="5"/>
  </g>

  <!-- Soft halo behind arm -->
  <circle cx="256" cy="280" r="160" fill="#FFFFFF" opacity="0.15"/>

  <g transform="translate(256 256)">

    <!-- Upper arm (horizontal, going to right shoulder, slight slope) -->
    <path d="M 130 -10
             Q 60 -30, 0 -10
             Q -60 10, -90 60
             Q -100 80, -78 95
             Q -20 75, 40 80
             Q 100 85, 140 60
             Q 158 40, 130 -10 Z"
          fill="url(#skin)" stroke="#A084DC" stroke-width="4" stroke-linejoin="round"/>

    <!-- Bicep bulge (peak on top of upper arm) -->
    <path d="M -10 -20
             Q 30 -85, 80 -78
             Q 110 -72, 105 -25
             Q 90 5, 40 -5
             Q -5 -8, -10 -20 Z"
          fill="url(#skin)" stroke="#A084DC" stroke-width="4" stroke-linejoin="round"/>
    <!-- Bicep highlight -->
    <ellipse cx="48" cy="-45" rx="28" ry="18" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="42" cy="-52" rx="14" ry="8" fill="#FFFFFF" opacity="0.8"/>

    <!-- Forearm (vertical, going UP from upper arm to fist) -->
    <path d="M -90 60
             Q -110 20, -100 -30
             Q -95 -85, -88 -130
             Q -82 -150, -50 -150
             Q -18 -150, -10 -130
             Q -5 -90, -8 -50
             Q -10 -20, -10 -10
             Q -50 25, -90 60 Z"
          fill="url(#skin)" stroke="#A084DC" stroke-width="4" stroke-linejoin="round"/>

    <!-- Forearm muscle highlight stripe -->
    <path d="M -78 -135 Q -70 -90, -75 -30 Q -78 -5, -80 10"
          stroke="#FFFFFF" stroke-width="8" opacity="0.5" fill="none" stroke-linecap="round"/>

    <!-- Wrist line -->
    <line x1="-90" y1="-150" x2="-12" y2="-150" stroke="#A084DC" stroke-width="3" opacity="0.6"/>

    <!-- Fist (hand) -->
    <path d="M -98 -188
             Q -55 -200, -10 -195
             Q 5 -190, 0 -160
             Q -10 -148, -50 -148
             Q -85 -148, -98 -155
             Q -110 -170, -98 -188 Z"
          fill="url(#skin)" stroke="#A084DC" stroke-width="4" stroke-linejoin="round"/>
    <!-- Knuckle creases -->
    <path d="M -85 -180 L -85 -160" stroke="#A084DC" stroke-width="2" opacity="0.4"/>
    <path d="M -65 -185 L -65 -158" stroke="#A084DC" stroke-width="2" opacity="0.4"/>
    <path d="M -45 -188 L -45 -156" stroke="#A084DC" stroke-width="2" opacity="0.4"/>
    <path d="M -25 -188 L -25 -154" stroke="#A084DC" stroke-width="2" opacity="0.4"/>

    <!-- DUMBBELL — horizontal, held by the fist -->
    <!-- Bar -->
    <rect x="-180" y="-180" width="280" height="16" rx="5" fill="url(#dumbbell)"/>
    <!-- Bar highlight -->
    <rect x="-175" y="-178" width="270" height="4" rx="2" fill="#FFFFFF" opacity="0.35"/>
    <!-- Left big weight -->
    <rect x="-220" y="-210" width="36" height="76" rx="8" fill="url(#dumbbell)"/>
    <!-- Left outer cap -->
    <rect x="-238" y="-200" width="20" height="56" rx="5" fill="#5B21B6"/>
    <!-- Right big weight -->
    <rect x="100" y="-210" width="36" height="76" rx="8" fill="url(#dumbbell)"/>
    <!-- Right outer cap -->
    <rect x="138" y="-200" width="20" height="56" rx="5" fill="#5B21B6"/>

    <!-- Pink bow on the wrist (feminine touch) -->
    <g transform="translate(-50 -135)">
      <path d="M 0 0 Q -18 -10, -22 0 Q -18 10, 0 0 Q 18 -10, 22 0 Q 18 10, 0 0 Z" fill="url(#ribbon)" stroke="#E879B3" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#E879B3"/>
    </g>
  </g>
</svg>
